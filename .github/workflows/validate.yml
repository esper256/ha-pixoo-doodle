name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * *"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check . && ruff format --check .
      - run: mypy custom_components/pixoo_doodle
      - run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=95
      - run: python -m coverage report --include='*/config_flow.py' --fail-under=100
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
