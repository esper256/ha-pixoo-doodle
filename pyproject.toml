[tool.ruff]
target-version = "py314"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.14"
follow_imports = "silent"
strict = true
[tool.coverage.run]
source = ["custom_components.pixoo_doodle"]
